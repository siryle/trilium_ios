name: iOS CI and unsigned release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing version tag (leave empty to publish the selected commit as a prerelease)'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Manual and tag-push releases for the same tag share one queue.
concurrency:
  group: ios-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable source revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      release: ${{ steps.source.outputs.release }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Validate tag and lock tested commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag=''
          release=false
          prerelease=false
          sha="$(git rev-parse --verify "${EVENT_SHA}^{commit}")"
          if [[ "$EVENT_NAME" == workflow_dispatch && -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            release=true
          elif [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            release=true
          elif [[ "$EVENT_NAME" == workflow_dispatch || ( "$EVENT_NAME" == push && "$REF_TYPE" == branch && "$REF_NAME" == main ) ]]; then
            [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]]
            tag="build-${RUN_NUMBER}-${sha:0:12}"
            release=true
            prerelease=true
          fi
          if [[ "$release" == true && "$prerelease" == false ]]; then
            # Version releases require an existing tag; build tags are created only after tests pass.
            [[ "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
            git check-ref-format "refs/tags/$tag"
            sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            if [[ "$EVENT_NAME" == push ]]; then
              [[ "$sha" == "$(git rev-parse --verify "${EVENT_SHA}^{commit}")" ]] || { echo 'Tag moved after this push'; exit 1; }
            fi
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntag=%s\nrelease=%s\nprerelease=%s\n' "$sha" "$tag" "$release" "$prerelease" >> "$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            printf '### IPA publication\n\nRelease: `%s`\n\nTested commit: `%s`\n\nPrerelease: `%s`\n' "$tag" "$sha" "$prerelease" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Pull request validation\n\nIPA publication is disabled for pull requests.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Test and archive on installed Xcode
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Generate native project and inspect installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_project.py
          python3 scripts/check_project.py
          ruby scripts/check_release_workflow.rb
          xcodebuild -version
          xcodebuild -showsdks
      - id: simulator
        name: Select an available iPhone simulator running iOS 17 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, os, re, sys
          data = json.load(open(sys.argv[1]))
          candidates = []
          for runtime, devices in data['devices'].items():
              version = re.search(r'\.iOS-(\d+)(?:-(\d+))?(?:-(\d+))?$', runtime)
              if not version:
                  continue
              numbers = tuple(int(part or 0) for part in version.groups())
              if numbers[0] < 17:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((numbers, device['name'], device['udid']))
          if not candidates:
              sys.exit('No available iPhone simulator with iOS >= 17 in installed Xcode')
          version, name, udid = sorted(candidates)[-1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'udid={udid}\n')
          print(f'Selected {name}, iOS {".".join(map(str, version))}, {udid}')
          PY
      - name: Run XCTest on selected iPhone simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project TriliumPocket.xcodeproj \
            -scheme TriliumPocket \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 180 \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log
      - name: Archive unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TriliumPocket.xcodeproj \
            -scheme TriliumPocket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TriliumPocket.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/archive.log
      - name: Package unsigned IPA and SHA-256 checksums
        if: needs.resolve.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          TESTED_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TESTED_SHA" ]]
          app='build/TriliumPocket.xcarchive/Products/Applications/TriliumPocket.app'
          test -d "$app"
          if codesign -dv "$app" 2>/dev/null; then
            echo 'Expected an unsigned archive, but a code signature exists'
            exit 1
          fi
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p build/package/Payload build/release
          ditto "$app" build/package/Payload/TriliumPocket.app
          (cd build/package && zip -qry "../release/TriliumPocket-${RELEASE_TAG}-unsigned.ipa" Payload)
          printf '%s\n' "$TESTED_SHA" > build/release/COMMIT_SHA.txt
          (cd build/release && shasum -a 256 "TriliumPocket-${RELEASE_TAG}-unsigned.ipa" COMMIT_SHA.txt > SHA256SUMS.txt)
      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ needs.resolve.outputs.sha }}
          path: |
            build/TestResults.xcresult
            build/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload release package for publication
        if: needs.resolve.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ needs.resolve.outputs.sha }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach tested unsigned IPA to GitHub Release
    if: needs.resolve.outputs.release == 'true'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize publication even when other workflow entry points use this tag.
    concurrency:
      group: ios-release-${{ github.repository }}-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-release-${{ needs.resolve.outputs.sha }}
          path: release
      - name: Verify tag still identifies the tested commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          TESTED_SHA: ${{ needs.resolve.outputs.sha }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$IS_PRERELEASE" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^build-[0-9]+-[0-9a-f]{12}$ ]]
            [[ "$RELEASE_TAG" == *"-${TESTED_SHA:0:12}" ]]
          else
            [[ "$IS_PRERELEASE" == false ]]
            [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          fi
          [[ "$(cat release/COMMIT_SHA.txt)" == "$TESTED_SHA" ]]
          (cd release && sha256sum -c SHA256SUMS.txt)
          printf 'TriliumPocket for iPhone (iOS 17+).\n\nTested source commit: `%s`\n\nThis IPA is unsigned. It must be signed with a valid Apple identity and provisioning profile before installation on a normal iPhone. No Apple signing credentials are used by this workflow.\n' "$TESTED_SHA" > release-notes.md
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            if [[ "$IS_PRERELEASE" == true ]]; then
              # Create an immutable build tag at the tested commit, never at the current main HEAD.
              gh release create "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --latest=false \
                --target "$TESTED_SHA" --title "TriliumPocket $RELEASE_TAG" --notes-file release-notes.md
            else
              gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag \
                --target "$TESTED_SHA" --title "TriliumPocket $RELEASE_TAG" --notes-file release-notes.md
            fi
          fi
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
          read -r kind sha <<< "$object"
          depth=0
          while [[ "$kind" == tag ]]; do
            depth=$((depth + 1))
            [[ "$depth" -le 10 ]] || { echo 'Excessively nested annotated tag'; exit 1; }
            object="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')"
            read -r kind sha <<< "$object"
          done
          [[ "$kind" == commit && "$sha" == "$TESTED_SHA" ]] || { echo 'Release tag no longer identifies the tested commit'; exit 1; }
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber \
            "release/TriliumPocket-${RELEASE_TAG}-unsigned.ipa" \
            release/SHA256SUMS.txt release/COMMIT_SHA.txt
          printf '### Published unsigned IPA\n\nRelease: https://github.com/%s/releases/tag/%s\n\nIPA: `TriliumPocket-%s-unsigned.ipa`\n' "$GH_REPO" "$RELEASE_TAG" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Retain the latest three workflow runs and IPA releases
    if: always() && github.event_name != 'pull_request'
    needs: [resolve, build, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: ios-retention-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete historical runs and release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/check_release_retention.rb
          options=(--apply)
          if [[ "$PUBLISHED" != success ]]; then
            options+=(--skip-releases)
          fi
          ruby scripts/prune_releases.rb "${options[@]}"
